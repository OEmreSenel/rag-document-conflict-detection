<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Document Management System</h1>

        <h2>Related Documents</h2>

        <label for="documents" class="upload-box">

            <div class="upload-icon">📁</div>

            <h3>Upload Documents</h3>

             <p>Drag & drop files here or click to browse</p>

        </label>

        <input type="file" id="documents" multiple accept=".pdf,.docx,.txt">

        <div class="title-row">
            <h2 id="selectedTitle">Selected Documents</h2>
            <button id="clearButton" type="button">Clear All</button>
        </div>

        <ul id="fileList">
            <li>No documents selected</li>
        </ul>

        <button id="saveButton">
            <span id="spinner" class="spinner"></span>
            <span id="buttonText">Save to Vector Database</span>
        </button>

        <div class="question-section">

            <h2>AI Document Assistant</h2>

            <div class="question-box">
                <input 
                    id="questionInput" 
                    type="text" 
                    placeholder="Ask a question about your documents..."
                >

                <button id="askButton">
                    Ask
                </button>
            </div>


            <div class="answer-box">

                <div class="answer-content">
                    <div id="answerText" class="empty">
                        No answer yet
                </div>
            </div>

</div>

    </div>

        <div id="messageOverlay">
        <div id="messageModal">
            <button id="closeMessage" type="button">×</button>
            <div id="messageIcon"></div>
            <p id="messageText"></p>
        </div>
    </div>

    <script src="script.js"></script>

</body>

</html>
